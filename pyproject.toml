[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Assistant vocal Jarvis pour Windows : « Hey Jarvis », globe holographique, voix ElevenLabs, cerveau Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  # cerveau
  "anthropic>=0.116",
  # audio
  "numpy>=1.26",
  "sounddevice>=0.4.7",
  "openwakeword>=0.6.0",
  "onnxruntime>=1.17",
  "webrtcvad-wheels>=2.0.14",
  "faster-whisper>=1.0.3",
  "edge-tts>=6.1.12",
  "miniaudio>=1.61",
  # interface
  "aiohttp>=3.9",
  "pywebview>=5.1",
  "pynput>=1.7.7",
  # outils
  "httpx>=0.27",
  "pyyaml>=6.0",
  "keyring>=25",
  "psutil>=5.9",
  "mss>=9.0",
  "pillow>=10.3",
  "yfinance>=0.2.40",
  "msal>=1.28",
  "google-api-python-client>=2.130",
  "google-auth-oauthlib>=1.2",
  "python-kasa>=0.7",
  # Windows uniquement
  "pywin32>=306; sys_platform == 'win32'",
  "pycaw>=20240210; sys_platform == 'win32'",
  "comtypes>=1.4; sys_platform == 'win32'",
  "winrt-runtime>=2.2; sys_platform == 'win32'",
  "winrt-Windows.Foundation>=2.2; sys_platform == 'win32'",
  "winrt-Windows.Foundation.Collections>=2.2; sys_platform == 'win32'",
  "winrt-Windows.Media.Control>=2.2; sys_platform == 'win32'",
  "winrt-Windows.Devices.Geolocation>=2.2; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.setuptools.package-data]
jarvis = ["ui/web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
